<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flohdle</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='14' fill='%232fbf71'/><text x='50' y='74' font-size='70' font-weight='800' font-family='sans-serif' text-anchor='middle' fill='white'>F</text></svg>">
  <link rel="stylesheet" href="/static/wordle/style.css">
</head>
<body>
  <header class="bar">
    <a class="back-link" href="/">&larr; All games</a>
    <div class="title">
      <h1>Flohdle</h1>
      <p id="subtitle" class="sub">Loading puzzle&hellip;</p>
    </div>
    <button id="stats-btn" class="icon-btn" aria-label="Statistics" title="Statistics">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 20V10h3v10H4zm6.5 0V4h3v16h-3zM17 20v-7h3v7h-3z"/></svg>
    </button>
  </header>

  <main>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="board" class="board" aria-label="Guesses"></div>
    <div id="keyboard" class="keyboard" aria-label="Keyboard"></div>
  </main>

  <div id="stats" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="stats-title">
      <button id="stats-close" class="icon-btn close" aria-label="Close">&times;</button>
      <p id="result-line" class="result-line" hidden></p>
      <h2 id="stats-title">Statistics</h2>
      <div class="stat-row">
        <div><strong id="st-played">0</strong><span>Played</span></div>
        <div><strong id="st-win">0</strong><span>Win %</span></div>
        <div><strong id="st-streak">0</strong><span>Current streak</span></div>
        <div><strong id="st-max">0</strong><span>Max streak</span></div>
      </div>
      <h3>Guess distribution</h3>
      <div id="dist" class="dist"></div>
      <button id="share-btn" class="btn primary wide" hidden>Share</button>
    </div>
  </div>

  <script src="/static/wordle/app.js"></script>
</body>
</html>
